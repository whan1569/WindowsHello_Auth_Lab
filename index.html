<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>Windows Hello Auth Lab</title></head>
<body>
<h1>Windows Hello Auth Lab</h1>
<p>관리자 PC 1대의 Windows Hello/WebAuthn 등록과 인증만 검증합니다.</p>
<button onclick="registerDevice()">관리자 PC 등록</button>
<button onclick="verifyDevice()">Windows Hello 인증</button>
<pre id="out"></pre>
<script>
const out = document.getElementById("out");
const b64uToBuf = s => Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/").padEnd(Math.ceil(s.length/4)*4,"=")), c=>c.charCodeAt(0));
const bufToB64u = b => btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const json = async (url, body) => {
  const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const d = await r.json(); if(!r.ok) throw new Error(d.detail||JSON.stringify(d)); return d;
};
async function registerDevice(){
 try{
  const o=await json("/register/begin");
  o.challenge=b64uToBuf(o.challenge); o.user.id=b64uToBuf(o.user.id);
  if(o.excludeCredentials) o.excludeCredentials=o.excludeCredentials.map(x=>({...x,id:b64uToBuf(x.id)}));
  const c=await navigator.credentials.create({publicKey:o});
  const payload={id:c.id,rawId:bufToB64u(c.rawId),type:c.type,response:{
   clientDataJSON:bufToB64u(c.response.clientDataJSON),
   attestationObject:bufToB64u(c.response.attestationObject),
   transports:c.response.getTransports?c.response.getTransports():[]
  },clientExtensionResults:c.getClientExtensionResults()};
  out.textContent=JSON.stringify(await json("/register/finish",{response:payload}),null,2);
 }catch(e){out.textContent=e.message}
}
async function verifyDevice(){
 try{
  const o=await json("/verify/begin");
  o.challenge=b64uToBuf(o.challenge);
  if(o.allowCredentials) o.allowCredentials=o.allowCredentials.map(x=>({...x,id:b64uToBuf(x.id)}));
  const c=await navigator.credentials.get({publicKey:o});
  const payload={id:c.id,rawId:bufToB64u(c.rawId),type:c.type,response:{
   clientDataJSON:bufToB64u(c.response.clientDataJSON),
   authenticatorData:bufToB64u(c.response.authenticatorData),
   signature:bufToB64u(c.response.signature),
   userHandle:c.response.userHandle?bufToB64u(c.response.userHandle):null
  },clientExtensionResults:c.getClientExtensionResults()};
  out.textContent=JSON.stringify(await json("/verify/finish",{response:payload}),null,2);
 }catch(e){out.textContent=e.message}
}
</script>
</body></html>
